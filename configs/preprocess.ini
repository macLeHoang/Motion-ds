# nvdspreprocess config: motion mosaic + person regions + staggered full frame (native/motion_preprocess).
# app/motion_ds_app.py rewrites [group-0] src-ids for the given inputs and sets preview-dir to the run folder.

[property]
enable=1
unique-id=1
gpu-id=0
process-on-frame=1
# nvinfer gie-unique-id that reads these tensors (= infer-unique-id below)
target-unique-ids=2
network-input-order=0
# batch = tensor slots per mux batch: up to one mosaic per camera + the cameras due for a full frame
network-input-shape=16;3;768;768
network-color-format=0
tensor-data-type=0
tensor-name=images
processing-width=768
processing-height=768
maintain-aspect-ratio=0
symmetric-padding=0
scaling-pool-memory-type=2
scaling-pool-compute-hw=1
scaling-filter=0
scaling-buf-pool-size=6
tensor-buf-pool-size=3
custom-lib-path=/work/build/motion/libvms_motion_preprocess.so
custom-tensor-preparation-function=CustomTensorPreparation

[group-0]
src-ids=0
process-on-roi=0

[user-configs]
gpu-id=0
# --- motion detector (100 px high grayscale) ---
motion-height=100
motion-threshold=30
contour-area=10
frame-alpha=0.01
lightning-threshold=0.8
contrast-history=50
improve-contrast=1
stale-frames=0
# camera on-screen clock (top right); normalised [x,y] polygons, ignored by motion
mask-polygons=[[[0.66,0],[1,0],[1,0.13],[0.66,0.13]]]
source-masks={}
# --- mosaic packing ---
crop-padding=0.15
gap=4
max-zoom=2
merge-growth=1.3
channel-scale=0.00392156862745098;0.00392156862745098;0.00392156862745098
channel-offset=0;0;0
# --- full frame (N) ---
# a full-frame slot every N frames per camera (25 = 1 s at 25 fps); 0 = never
full-frame-interval=25
# 1: camera i takes its full frame when (frame + i) % N == 0, so cameras take turns
full-frame-stagger=1
# --- person regions (K) ---
# K: mosaic inferences without a person inside before a region is removed
region-max-misses=25
region-padding=0.2
region-match-iou=0.3
# mosaic person score that refreshes / creates a region
region-score=0.5
# full-frame person score that seeds a region
seed-score=0.5
max-regions=16
# --- decode (vms_motion_decode_probe) ---
infer-unique-id=2
num-classes=81
det-score=0.25
dedupe-iou=0.5
# classes taken from mosaic slots (persons); their full-frame boxes seed regions
mosaic-classes=0
# classes taken from full-frame slots: two_wheeler, light_vehicle, heavy_machinery, fire, smoke, license_plate
full-frame-classes=1;2;3;4;5;6
labels-file=/work/configs/labels.txt
parser-lib=/work/build/parser/libnvds_infer_yolo_attr.so
parser-func=NvDsInferYoloAttr
# --- logs: every frame's plan goes to <preview-dir>/events_1.jsonl, a snapshot every 1/preview-fps s ---
preview-dir=
preview-fps=0.2
